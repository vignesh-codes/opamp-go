
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: otel-agent-kubeletstats-role
  labels:
    app.kubernetes.io/name: opentelemetry-collector
    app.kubernetes.io/component: agent
rules:
  - apiGroups: [""]
    resources: ["nodes/stats"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["nodes/proxy"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: otel-agent-kubeletstats-binding
  labels:
    app.kubernetes.io/name: opentelemetry-collector
    app.kubernetes.io/component: agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: otel-agent-kubeletstats-role
subjects:
  - kind: ServiceAccount
    name: otel-agent-opentelemetry-collector
    namespace: otel-agent


